<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>cvoid</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2302030e'/%3E%3Crect x='5' y='5' width='6' height='6' fill='none' stroke='%235f8cff'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #02030e; overflow: hidden; }
  body {
    color: #cfdcff; font: 300 13px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: .12em; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #start {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center; cursor: pointer;
    background: radial-gradient(ellipse at center, rgba(2,3,14,0) 0%, rgba(2,3,14,.75) 100%);
    transition: opacity 2.5s ease;
  }
  #start h1 { margin: 0; font-weight: 200; font-size: clamp(40px, 9vw, 110px); letter-spacing: .5em; text-indent: .5em; text-shadow: 0 0 40px #5f8cff; }
  #start p { margin: 2.5em 0 0; opacity: .7; text-transform: lowercase; animation: breathe 3s ease-in-out infinite; }
  #start.gone { opacity: 0; pointer-events: none; }
  /* volume: on the start screen and in the map's panel */
  .volume { display: flex; align-items: center; gap: 10px; font: 300 12px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .1em; color: #cfdcff; text-transform: lowercase; }
  /* a hairline like the structures' lit edges, and a small hollow square for a handle */
  .volume input {
    --v: 1; -webkit-appearance: none; appearance: none; width: 170px; height: 18px; margin: 0;
    background: transparent; cursor: pointer; outline: none;
  }
  .volume input::-webkit-slider-runnable-track {
    height: 1px; box-shadow: 0 0 6px rgba(95, 140, 255, .45);
    background: linear-gradient(to right, #9fb8ff calc(4.5px + (100% - 9px) * var(--v)), rgba(140, 160, 220, .28) 0);
  }
  .volume input::-moz-range-track { height: 1px; background: rgba(140, 160, 220, .28); }
  .volume input::-moz-range-progress { height: 1px; background: #9fb8ff; box-shadow: 0 0 6px rgba(95, 140, 255, .45); }
  .volume input::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 9px; height: 9px; margin-top: -4px;
    background: #02030e; border: 1px solid #cfdcff; box-shadow: 0 0 8px #5f8cff; transition: background .2s, box-shadow .2s;
  }
  .volume input::-moz-range-thumb {
    width: 7px; height: 7px; border-radius: 0; background: #02030e; border: 1px solid #cfdcff;
    box-shadow: 0 0 8px #5f8cff; transition: background .2s, box-shadow .2s;
  }
  .volume input:hover::-webkit-slider-thumb, .volume input:focus-visible::-webkit-slider-thumb { background: #9fb8ff; box-shadow: 0 0 12px #5f8cff; }
  .volume input:hover::-moz-range-thumb, .volume input:focus-visible::-moz-range-thumb { background: #9fb8ff; box-shadow: 0 0 12px #5f8cff; }
  .volume output { width: 3ch; opacity: .7; font-variant-numeric: tabular-nums; }
  #start .volume { justify-content: center; gap: 16px; margin-top: 2.6em; opacity: .7; text-shadow: 0 0 12px rgba(95, 140, 255, .5); }
  /* label and number as wide as each other, so the line sits under the middle of the screen */
  #start .volume span, #start .volume output { width: 5em; }
  #start .volume span { text-align: right; }
  #start .volume output { text-align: left; }
  @keyframes breathe { 50% { opacity: .25; } }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 3s ease 1.5s; }
  #hud.on { opacity: 1; }
  #sector { position: absolute; left: 6vw; bottom: 14vh; max-width: 80vw; text-shadow: 0 0 18px rgba(0,0,0,.8); }
  #name { font-weight: 200; font-size: clamp(26px, 4.6vw, 60px); letter-spacing: .32em; line-height: 1.15; }
  #inscription { margin-top: .6em; font-size: clamp(12px, 1.3vw, 16px); opacity: .8; letter-spacing: .16em; }
  #sector.enter #name { animation: reveal 2.6s cubic-bezier(.2,.7,.2,1) both; }
  #sector.enter #inscription { animation: reveal 2.6s .5s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes reveal { from { opacity: 0; letter-spacing: .7em; filter: blur(6px); } }
  #meta { position: absolute; left: 6vw; bottom: 5.5vh; font-size: 11px; opacity: .7; text-transform: lowercase; font-variant-numeric: tabular-nums; }
  #entity {
    position: absolute; left: 8vw; right: 8vw; top: 60%; text-align: center; color: #eef2ff;
    font-size: clamp(15px, 1.7vw, 23px); letter-spacing: .34em; text-transform: lowercase;
    text-shadow: 0 0 22px rgba(170, 195, 255, .65); opacity: 0; filter: blur(5px);
    transition: opacity 1.8s ease, filter 1.8s ease;
  }
  #entity.show { opacity: .92; filter: blur(0); }
  /* marderchen speaks in running rainbow colours, like the text on his homepage */
  #marder {
    position: absolute; left: 8vw; right: 8vw; top: 66%; text-align: center; font-family: monospace;
    font-size: clamp(15px, 1.7vw, 22px); letter-spacing: .08em; opacity: 0; transition: opacity .5s ease;
    animation: rainbow 2.6s linear infinite; text-shadow: 0 0 14px currentColor;
  }
  #marder.show { opacity: 1; }
  @keyframes rainbow {
    0% { color: #ff0000; } 14% { color: #ffff00; } 28% { color: #00ff00; } 42% { color: #00ffff; }
    57% { color: #00aaff; } 71% { color: #aa00ff; } 85% { color: #ff00ff; } 100% { color: #ff0000; }
  }
  #waits { font-size: 12px; color: #eef2ff; margin-bottom: .5em; letter-spacing: .16em; min-height: 1.5em; }
  /* a Flash piece playing where it hangs: stretched onto its wall by a transform set every frame */
  #wall { position: fixed; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; display: none; background: #000; }
  /* the dark of his portal: gathers as you go in, lifts as you come out */
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #hint {
    position: fixed; left: 0; right: 0; top: 14vh; text-align: center; pointer-events: none; font-family: monospace;
    font-size: 14px; letter-spacing: .06em; color: #00ffff; text-shadow: 0 0 10px #00ffff;
  }
  /* a museum piece opened full screen */
  #stage {
    position: fixed; inset: 0; display: none; place-content: center; justify-items: center; gap: 14px;
    background: rgba(0, 0, 0, .93); z-index: 5;
  }
  #stage.on { display: grid; }
  #stage img { max-width: 92vw; max-height: 84vh; min-width: min(60vw, 60vh); object-fit: contain; }
  #stage img.pixels { image-rendering: pixelated; }
  #stage .caption { font-family: monospace; font-size: 13px; letter-spacing: .06em; color: #ff00ff; text-transform: none; }
  #stage .warning { max-width: 46ch; text-align: center; font-family: monospace; font-size: 16px; line-height: 1.7; color: #ffff00; letter-spacing: .04em; }
  #coords { font-size: 13px; margin-bottom: .3em; letter-spacing: .14em; }
  #map { opacity: 0; pointer-events: none; transition: opacity .25s ease; cursor: crosshair; }
  #map.on { opacity: 1; pointer-events: auto; }
  /* on the map: an exact place to go, and where to start */
  #mapPanel {
    position: fixed; left: 24px; bottom: 24px; z-index: 4; display: none; flex-direction: column; gap: 8px;
    padding: 14px 16px; background: rgba(2, 3, 14, .85); border: 1px solid rgba(140, 160, 220, .3);
    font: 300 12px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .08em; color: #cfdcff;
  }
  .mapping #mapPanel { display: flex; }
  #mapPanel .row { display: flex; align-items: center; gap: 6px; }
  #mapPanel .row span { width: 5.5em; opacity: .6; }
  #mapPanel input {
    width: 6.5em; padding: 4px 6px; background: rgba(140, 160, 220, .08); border: 1px solid rgba(140, 160, 220, .3);
    color: #fff; font: inherit; letter-spacing: .04em;
  }
  #mapPanel button {
    padding: 5px 10px; background: rgba(140, 160, 220, .12); border: 1px solid rgba(140, 160, 220, .4);
    color: #fff; font: inherit; letter-spacing: .08em; cursor: pointer;
  }
  #mapPanel button:hover { background: rgba(140, 160, 220, .28); }
  #mNote { min-height: 1.2em; opacity: .7; max-width: 44ch; }
  #sector, #help { transition: opacity .25s ease; }
  .mapping #sector, .mapping #help { opacity: 0; }
  .seated #sector { opacity: 0; } /* at the well in the zone: the place's name would sit over the game */
  #meta .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: .7em; background: currentColor; vertical-align: 1px; }
  #meta.waiting .dot { animation: breathe 1s ease-in-out infinite; }
  #help { position: absolute; right: 6vw; bottom: 7vh; max-width: 46vw; font-size: 11px; opacity: .4; text-align: right; text-transform: lowercase; }
  @media (max-width: 700px) { #help { display: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="wall"></div>
<div id="fade"></div>
<canvas id="map"></canvas>
<div id="mapPanel">
  <div class="row"><span>sector</span><input id="mSX" placeholder="x"><input id="mSY" placeholder="y"><input id="mSZ" placeholder="z"></div>
  <div class="row"><span>offset</span><input id="mOX" placeholder="x"><input id="mOY" placeholder="y"><input id="mOZ" placeholder="z"></div>
  <div class="row"><button id="mGo">go</button><button id="mSpawn">start here</button><button id="mRandom">random</button><button id="mOrigin">origin</button><button id="mHere">find me</button></div>
  <div id="mNote">click the map to pick a spot, or type one</div>
  <label class="volume"><span>volume</span><input type="range" min="0" max="100" step="1"><output></output></label>
</div>
<div id="hud">
  <div id="sector"><div id="name"></div><div id="inscription"></div></div>
  <div id="entity"></div>
  <div id="marder"></div>
  <div id="meta"><div id="waits"></div><div id="coords"></div><span class="dot"></span><span id="status"></span></div>
  <div id="help"></div>
</div>
<div id="hint"></div>
<div id="stage"></div>
<div id="start"><div><h1>cvoid</h1><p id="prompt">click to materialize</p>
  <label class="volume"><span>volume</span><input type="range" min="0" max="100" step="1"><output></output></label></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
